name: İndirim Tarama

on:
  schedule:
    - cron: '0 */4 * * *'   # her 4 saatte bir (UTC saatiyle)
  workflow_dispatch:         # Actions sekmesinden elle de çalıştırabilirsin

permissions:
  contents: write

jobs:
  tara:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıkları kur
        run: pip install requests beautifulsoup4

      - name: Tara ve deals.json'ı üret
        run: python scraper.py

      - name: Sonucu depoya commit'le
        run: |
          git config user.name "indirim-fisi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add deals.json
          git diff --cached --quiet && echo "Değişiklik yok" || git commit -m "İndirimleri güncelle: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
